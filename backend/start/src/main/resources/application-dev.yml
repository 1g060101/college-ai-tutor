spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_tutor?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "061001"
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  ai:
    deepseek:
      # DeepSeek 真实 API Key 走环境变量 DEEPSEEK_API_KEY，避免明文入库
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}

logging:
  level:
    com.aistudy: DEBUG